<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta name="theme-color" content="#e2e2e2">
  <title>Serial Debug Assistant</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <!-- Icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-sliders" viewBox="0 0 24 24">
      <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
      <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
      <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
    </symbol>
  </svg>

  <!-- Connection Bar -->
  <div class="conn-bar" id="connBar">
    <div class="conn-group port-group">
      <span class="conn-label desktop-only">Port:</span>
      <span id="portName" class="port-name">—</span>
      <span id="paramSummary" class="param-summary mobile-only" data-toggle="connBar" role="button" title="Port settings">9600 8N1</span>
    </div>
    <!-- On mobile everything in .bar-opts is tucked behind the settings button -->
    <div class="bar-opts">
      <div class="conn-sep"></div>
      <label class="chk-label conn-label"><input type="checkbox" id="chkMqtt"> MQTT</label>
      <label class="chk-label conn-label"><input type="checkbox" id="chkSlave"> MS</label>
      <div class="conn-sep"></div>
      <div class="conn-group">
        <label class="conn-label" for="baud">Baud</label>
        <select id="baud">
          <option>300</option>
          <option>1200</option>
          <option>2400</option>
          <option>4800</option>
          <option selected>9600</option>
          <option>19200</option>
          <option>38400</option>
          <option>57600</option>
          <option>115200</option>
          <option>230400</option>
          <option>460800</option>
          <option>921600</option>
        </select>
      </div>
      <div class="conn-group">
        <label class="conn-label" for="dataBits">Data</label>
        <select id="dataBits">
          <option>7</option>
          <option selected>8</option>
        </select>
      </div>
      <div class="conn-group">
        <label class="conn-label" for="parity">Parity</label>
        <select id="parity">
          <option value="none" selected>None</option>
          <option value="even">Even</option>
          <option value="odd">Odd</option>
        </select>
      </div>
      <div class="conn-group">
        <label class="conn-label" for="stopBits">Stop</label>
        <select id="stopBits">
          <option value="1" selected>1</option>
          <option value="2">2</option>
        </select>
      </div>
      <!-- Multi-port adapters (FT2232, FT4232, CP2105, composite CDC): shown when one is open -->
      <div class="conn-group" id="channelGroup" style="display:none">
        <label class="conn-label" for="usbChannel">Ch</label>
        <select id="usbChannel">
          <option value="0" selected>A</option>
          <option value="1">B</option>
          <option value="2">C</option>
          <option value="3">D</option>
        </select>
      </div>
      <!-- Android only: USB adapters need WebUSB; Web Serial there only sees Bluetooth -->
      <div class="conn-group" id="transportGroup" style="display:none">
        <label class="conn-label" for="transport">Via</label>
        <select id="transport">
          <option value="usb" selected>USB adapter</option>
          <option value="serial">Bluetooth / system</option>
        </select>
      </div>
      <div class="conn-sep"></div>
    </div>
    <button id="btnOpen" class="btn btn-open">Open</button>
    <div class="spacer"></div>
    <button class="btn btn-icon btn-opts mobile-only" data-toggle="connBar" title="Port settings" aria-label="Port settings" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-sliders"/></svg></button>
    <button id="btnHelp" class="btn btn-sm btn-help" title="Help">?</button>
  </div>

  <!-- MQTT Credentials Bar -->
  <div id="mqttBar" class="conn-bar mqtt-bar" style="display:none">
    <span class="conn-label mqtt-title mobile-only">MQTT</span>
    <div class="bar-opts">
      <div class="conn-group mq-url">
        <select id="mqttProto">
          <option value="ws://">ws://</option>
          <option value="wss://">wss://</option>
        </select>
        <input type="text" id="mqttHost" placeholder="host or IP" autocapitalize="off" spellcheck="false">
        <span class="conn-label">:</span>
        <input type="number" id="mqttPort" placeholder="8083" min="1" max="65535" inputmode="numeric">
        <input type="text" id="mqttPath" placeholder="/mqtt" autocapitalize="off" spellcheck="false">
      </div>
      <div class="conn-sep"></div>
      <div class="conn-group mq-half">
        <span class="conn-label">User</span>
        <input type="text" id="mqttUser" placeholder="username" autocapitalize="off" spellcheck="false">
      </div>
      <div class="conn-group mq-half">
        <span class="conn-label">Pass</span>
        <input type="password" id="mqttPass" placeholder="password">
      </div>
      <div class="conn-sep"></div>
      <div class="conn-group">
        <span class="conn-label">Pub</span>
        <input type="text" id="mqttSendTopic" class="mq-topic" placeholder="O/imei/rec" autocapitalize="off" spellcheck="false">
      </div>
      <div class="conn-group">
        <span class="conn-label">Sub</span>
        <input type="text" id="mqttRecvTopic" class="mq-topic" placeholder="O/imei/out" autocapitalize="off" spellcheck="false">
      </div>
      <div class="conn-group">
        <span class="conn-label">Status</span>
        <input type="text" id="mqttStatusTopic" class="mq-topic" placeholder="O/imei/status" autocapitalize="off" spellcheck="false">
      </div>
      <div class="conn-sep"></div>
      <div class="conn-group mq-qos">
        <span class="conn-label">QoS</span>
        <select id="mqttQos">
          <option value="0" selected>0</option>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>
      </div>
      <label class="chk-label conn-label"><input type="checkbox" id="mqttRetain"> Retain</label>
      <div class="conn-sep"></div>
    </div>
    <button id="btnMqttConnect" class="btn btn-open">Connect</button>
    <div class="conn-sep" id="mqttStatusSep" style="display:none"></div>
    <span id="mqttDevDot" class="conn-dot" style="display:none"></span>
    <span id="mqttDevInfo" class="mqtt-dev-info" style="display:none"></span>
    <button class="btn btn-icon btn-opts mobile-only" data-toggle="mqttBar" title="MQTT settings" aria-label="MQTT settings" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-sliders"/></svg></button>
  </div>

  <!-- Main Area -->
  <div class="main">

    <!-- Left Column: Receive + Send -->
    <div class="left-col">

      <!-- Receive Panel -->
      <div class="panel rx-panel" id="rxPanel">
        <div class="panel-bar">
          <span class="panel-title">Receive</span>
          <div class="bar-opts">
            <label class="chk-label"><input type="checkbox" id="rxHex"> Hex</label>
            <label class="chk-label"><input type="checkbox" id="showTx"> Show TX</label>
            <label class="chk-label"><input type="checkbox" id="showTs"> Time</label>
            <span class="bar-sep">|</span>
            <label class="chk-label"><input type="checkbox" id="autoBreak"> Frame Break</label>
            <span class="conn-group">
              <input type="number" id="breakMs" value="500" min="1" max="60000" class="num-input" inputmode="numeric">
              <span class="unit">ms</span>
            </span>
            <span class="bar-sep log-ctrl">|</span>
            <button id="btnLog" class="btn btn-sm log-ctrl">Log</button>
            <label class="chk-label log-ctrl"><input type="checkbox" id="chkLogAppend"> Append</label>
            <span id="logFileName" class="log-file-name log-ctrl"></span>
          </div>
          <div class="spacer"></div>
          <button id="btnPause" class="btn">Pause</button>
          <button id="btnClearRx" class="btn">Clear</button>
          <button class="btn btn-icon btn-opts mobile-only" data-toggle="rxPanel" title="Receive options" aria-label="Receive options" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-sliders"/></svg></button>
        </div>
        <div id="rxArea" class="rx-area"></div>
      </div>

      <!-- Send Panel -->
      <div class="panel tx-panel">
        <div class="panel-bar">
          <span class="panel-title">Send</span>
          <label class="chk-label"><input type="checkbox" id="txHex"> Hex</label>
          <label class="chk-label"><input type="checkbox" id="appendNL"> +\r\n</label>
        </div>
        <div class="tx-row">
          <input type="text" id="txInput" class="tx-input" placeholder="Data to send…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
          <button id="btnSend" class="btn btn-send">Send</button>
        </div>
      </div>

    </div>

    <!-- Right Column: Extension Commands -->
    <div class="panel cmd-panel" id="cmdPanel">
      <div class="panel-bar">
        <span class="panel-title"><span class="desktop-only">Extension </span>Commands</span>
        <div class="spacer"></div>
        <div class="bar-opts">
          <span class="conn-group">
            <input type="number" id="pollDelay" value="500" min="0" max="60000" class="num-input" style="width:55px" inputmode="numeric">
            <span class="unit">ms</span>
          </span>
          <label class="chk-label"><input type="checkbox" id="pollLoop"> Loop</label>
        </div>
        <button id="btnPoll" class="btn btn-sm">Poll</button>
        <div class="bar-opts">
          <span class="bar-sep">|</span>
          <button id="btnImportCmds" class="btn btn-sm">Import</button>
          <button id="btnExportCmds" class="btn btn-sm">Export</button>
        </div>
        <button id="btnAddCmd" class="btn btn-sm">+ Add</button>
        <button class="btn btn-icon btn-opts mobile-only" data-toggle="cmdPanel" title="Poll &amp; import options" aria-label="Poll and import options" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-sliders"/></svg></button>
      </div>
      <div id="cmdList" class="cmd-list"></div>
      <input type="file" id="importFileInput" accept=".json,application/json" style="display:none">
    </div>

  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span id="connDot" class="conn-dot"></span>
    <span id="connStatus">Disconnected</span>
    <span class="bar-sep">|</span>
    <span id="rxStat">RX: 0 B</span>
    <span class="bar-sep">|</span>
    <span id="txStat">TX: 0 B</span>
    <span id="lineErr" class="line-err" style="display:none" role="button"></span>
    <div class="spacer"></div>
    <span id="portInfo" class="port-info">No Port</span>
  </div>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="js/storage.js?v=3"></script>
  <script src="js/serial.js?v=3"></script>
  <script src="js/usbserial.js?v=3"></script>
  <script src="js/mqtt.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
